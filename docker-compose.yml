# Chimera with Docker Compose, using the published images.
#
#   docker compose up -d                    # Chimera only (llama-server runs on your host)
#   docker compose --profile searxng up -d  # + SearXNG for web search (docs/WEB.md)
#   docker compose --profile browser up -d  # + headless browser for JavaScript pages
#                                           #   (needs CHIMERA_BROWSER_URL and CHIMERA_BROWSER_SECRET in .env)
#   docker compose --profile llama up -d    # + llama-server in a container
#
# Open http://localhost:8700. Install and update: docs/DEPLOYMENT.md
# (scripts/install-docker.sh, scripts/update.sh). Contributors build the
# images locally with docker-compose.dev.yml.
#
# Versions: CHIMERA_VERSION in .env pins the release (default below = this
# file's release). Third-party images are pinned to exact versions; Dependabot
# proposes updates (see docs/DEPLOYMENT.md, "Image pinning").
services:
  chimera:
    image: ghcr.io/riloative/chimera:${CHIMERA_VERSION:-1.0.0}
    container_name: chimera
    restart: unless-stopped
    ports:
      # Published on the host's loopback interface only. For LAN access change
      # this to "8700:8700", add your host name to CHIMERA_ALLOWED_HOSTS and
      # preferably put HTTPS in front (docs/REVERSE_PROXY.md).
      - "${CHIMERA_PUBLISH:-127.0.0.1:8700}:8700"
    env_file:
      - path: .env
        required: false
    environment:
      # Container paths; these override anything in .env.
      CHIMERA_HOST: 0.0.0.0
      CHIMERA_PORT: "8700"
      CHIMERA_DATA_DIR: /data
      CHIMERA_STATIC_DIR: /app/static
      # Accounts: the first registration creates the administrator.
      CHIMERA_REGISTRATION_MODE: ${CHIMERA_REGISTRATION_MODE:-first_user_only}
      # First-run connection: llama-server on the Docker host (docs/DEPLOYMENT.md,
      # "llama-server on the same host").
      CHIMERA_SEED_PROVIDER_URL: ${CHIMERA_SEED_PROVIDER_URL:-http://host.docker.internal:8080}
      # Egress filter proxy for the headless browser (only used when
      # CHIMERA_BROWSER_URL is set). Not published; it accepts only the
      # single-use credentials Chimera issues for each render.
      CHIMERA_BROWSER_PROXY_BIND: 0.0.0.0:8701
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chimera-data:/data
    networks:
      - default
      - browser-net
    # Hardening: nothing but /data (volume) and /tmp (memory) is writable.
    read_only: true
    tmpfs:
      - /tmp:size=512m,uid=10001,gid=10001,mode=1700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits (override in docker-compose.override.yml if needed;
    # large knowledge-base uploads are the main memory user).
    mem_limit: ${CHIMERA_MEM_LIMIT:-2g}
    pids_limit: 512
    healthcheck:
      # Readiness: migrations complete and the database writable.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8700/api/ready', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    # Running answers get up to CHIMERA_SHUTDOWN_GRACE_SECONDS (10 s) twice
    # (open streams, then generations) before they are saved as interrupted.
    stop_grace_period: 30s

  # Optional: llama.cpp's server in a container (CPU build). Put a GGUF file in
  # ./models and set LLAMA_MODEL to its file name. In Chimera, add a connection
  # to http://llama-server:8080. For GPUs, use the matching llama.cpp image tag
  # (e.g. server-cuda-b<build>) and the corresponding device options.
  llama-server:
    profiles: ["llama"]
    image: ghcr.io/ggml-org/llama.cpp:server-b11669
    container_name: llama-server
    restart: unless-stopped
    command: ["-m", "/models/${LLAMA_MODEL:-model.gguf}", "--host", "0.0.0.0", "--port", "8080", "-c", "${LLAMA_CTX:-8192}", "-np", "${LLAMA_PARALLEL:-1}"]
    volumes:
      - ./models:/models:ro
    # Not published to the host: only Chimera talks to it on the compose network.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 300s  # loading a model can take minutes
      retries: 3

  # Optional: self-hosted metasearch for web search. Not published to the host;
  # only Chimera reaches it on the compose network. Set SEARXNG_SECRET in .env
  # (openssl rand -hex 32), then in Chimera: Settings → Web → Engine "SearXNG",
  # address http://searxng:8080 (or set CHIMERA_WEB_SEARXNG_URL=http://searxng:8080).
  searxng:
    profiles: ["searxng"]
    image: docker.io/searxng/searxng:2026.10.15-b00212a83
    container_name: chimera-searxng
    restart: unless-stopped
    environment:
      # Unset → SearXNG's own "unset" marker, which it refuses to start with (fails closed).
      SEARXNG_SECRET: ${SEARXNG_SECRET:-ultrasecretkey}
      SEARXNG_BASE_URL: http://searxng:8080/
      # Listen on IPv4: the image's default (::) fails on hosts without IPv6.
      GRANIAN_HOST: 0.0.0.0
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - "8080"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional: headless Chromium that renders pages needing JavaScript. It sits
  # on an internal network with no route to the internet or the host; its
  # only way out is Chimera's egress filter proxy, which applies the same
  # rules as Chimera's own page fetcher. Never publish its port. See docs/WEB.md.
  browser:
    profiles: ["browser"]
    image: ghcr.io/riloative/chimera-browser:${CHIMERA_VERSION:-1.0.0}
    container_name: chimera-browser
    restart: unless-stopped
    environment:
      # Empty → the service refuses to start (fails closed).
      BROWSER_SECRET: ${CHIMERA_BROWSER_SECRET:-}
      BROWSER_PROXY_SERVER: http://chimera:8701
      BROWSER_MAX_PAGES: ${BROWSER_MAX_PAGES:-2}
      # How long to wait for a page to settle (see browser/README.md).
      BROWSER_SETTLE_MAX_MS: ${BROWSER_SETTLE_MAX_MS:-${BROWSER_SETTLE_MS:-15000}}
      BROWSER_SETTLE_QUIET_MS: ${BROWSER_SETTLE_QUIET_MS:-750}
      BROWSER_SETTLE_MIN_MS: ${BROWSER_SETTLE_MIN_MS:-300}
    networks:
      - browser-net
    expose:
      - "3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/pwuser:size=64m,uid=1001,gid=1001
    shm_size: 512m
    mem_limit: ${BROWSER_MEM_LIMIT:-1536m}
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The image's HEALTHCHECK (GET /health) applies.

networks:
  default:
  # internal: no gateway, so nothing on it can reach the internet or the host.
  browser-net:
    internal: true

volumes:
  chimera-data:
