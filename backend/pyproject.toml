[project]
name = "chimera"
version = "1.2.0"
description = "A minimalist, privacy-first, self-hosted AI chat workspace for local LLMs (llama.cpp / llama-server, Ollama, OpenAI-compatible servers)."
license = "MIT"  # SPDX
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "numpy>=1.26",
  "argon2-cffi>=25.1.0",
  "cryptography>=42",
  # Web reading: main-content extraction to Markdown (pulls in lxml and
  # charset-normalizer, which are also used directly).
  "trafilatura>=2.0,<3",
  "lxml>=5.0",
  "charset-normalizer>=3.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chimera = "chimera.__main__:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 SPDX license field
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chimera*"]

[tool.setuptools.package-data]
chimera = ["static/**/*", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
