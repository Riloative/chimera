[project]
name = "chimera"
version = "0.1.0"
description = "A minimalist, privacy-first, self-hosted AI chat workspace for local LLMs (llama.cpp / llama-server, Ollama, OpenAI-compatible servers)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
chimera = "chimera.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chimera*"]

[tool.setuptools.package-data]
chimera = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
