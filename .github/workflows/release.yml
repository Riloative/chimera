# Release: push a tag vX.Y.Z (or vX.Y.Z-rc.N). Runs the full CI, then builds,
# scans, signs and publishes both images to GHCR, and creates the GitHub
# Release with notes from CHANGELOG.md and the install/update assets.
# Only the built-in GITHUB_TOKEN is used. See RELEASING.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  prepare:
    name: Check version and notes
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          python3 scripts/check-version.py --tag "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          python3 scripts/changelog-section.py "$version" > /dev/null

  images:
    name: Publish ${{ matrix.image }}
    needs: [ci, prepare]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push to ghcr.io with GITHUB_TOKEN
      id-token: write   # keyless cosign signing (Sigstore OIDC)
    strategy:
      matrix:
        include:
          - image: chimera
            context: .
          - image: chimera-browser
            context: browser
    env:
      IMAGE: ghcr.io/riloative/${{ matrix.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3, 1.2 and 1 for releases; only the exact version for pre-releases;
          # latest for stable releases only.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
      - name: Build for the vulnerability scan (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: scan/${{ matrix.image }}:${{ env.VERSION }}
          build-args: |
            CHIMERA_BUILD_COMMIT=${{ github.sha }}
            CHIMERA_VERSION=${{ env.VERSION }}
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - name: Scan (fail on fixable critical vulnerabilities)
        env:
          SCAN_IMAGE: scan/${{ matrix.image }}:${{ env.VERSION }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.75.0 image --exit-code 1 --severity CRITICAL --ignore-unfixed --no-progress "$SCAN_IMAGE"
      - id: build
        name: Build and push (linux/amd64, linux/arm64) with SBOM and provenance
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CHIMERA_BUILD_COMMIT=${{ github.sha }}
            CHIMERA_VERSION=${{ env.VERSION }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  release:
    name: GitHub Release
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assets and checksums
        run: |
          set -eu
          mkdir dist
          cp docker-compose.yml .env.example scripts/install-docker.sh scripts/update.sh dist/
          cp deploy/searxng/settings.yml dist/searxng-settings.yml
          cp deploy/systemd/chimera-update.service deploy/systemd/chimera-update.timer dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          python3 scripts/changelog-section.py "$VERSION" > notes.md
          cat >> notes.md <<EOF

          ## Images

          - \`ghcr.io/riloative/chimera:$VERSION\`
          - \`ghcr.io/riloative/chimera-browser:$VERSION\`

          linux/amd64 and linux/arm64, signed with Sigstore cosign (keyless) and published with SBOM and provenance attestations. Verify: see docs/SECURITY.md, "Verifying images".

          Install or update: docs/DEPLOYMENT.md.
          EOF
      - name: Create the release
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -eu
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; else flags="--latest"; fi
          # shellcheck disable=SC2086
          gh release create "$TAG" --verify-tag --title "Chimera $VERSION" --notes-file notes.md $flags dist/*
